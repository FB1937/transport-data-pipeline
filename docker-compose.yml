services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - transit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://transit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/transit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["sh", "-c", "python -m src.run_pipeline && python -m src.load_postgres"]

volumes:
  transit-postgres:
